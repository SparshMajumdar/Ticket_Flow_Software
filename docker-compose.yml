services:
  ticket-flow-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: supportflow-ticket-flow-web
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/index.html"]
      interval: 30s
      timeout: 5s
      retries: 3



name: SupportFlow CI/CD Pipeline

on:
  push:
    branches:
      - main
      - "feature/**"
      - "feat/**"
      - "fix/**"
      - "hotfix/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

jobs:

  # =========================================================================
  # CI STAGE 1: Code Quality, Linting & Asset Validation
  # =========================================================================
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run code & asset linter
        run: npm run lint


  # =========================================================================
  # CI STAGE 2: Automated Testing & Build Integrity Verification
  # =========================================================================
  test-and-build:
    name: Test & Build Integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run automated test suite
        run: npm test

      - name: Verify application build
        run: npm run build

      - name: Upload build distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: supportflow-build-${{ github.sha }}
          path: frontend/
          retention-days: 14


  # =========================================================================
  # CI STAGE 3: Docker Container Build & Runtime Verification
  # =========================================================================
  docker-validation:
    name: Docker Build & Health Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: |
            supportflow-ticket-system:latest
            supportflow-ticket-system:${{ github.sha }}

      - name: Test container startup & HTTP response
        run: |
          docker run -d --name supportflow-test -p 8080:80 supportflow-ticket-system:latest
          sleep 3
          curl -f http://localhost:8080/index.html || exit 1
          docker stop supportflow-test


  # =========================================================================
  # CD STAGE 1: Publish Docker Image to GitHub Container Registry (GHCR)
  # Only runs on pushes/manual runs to main after all CI checks pass
  # =========================================================================
  docker-publish:
    name: Publish Docker Image to GHCR

    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    needs:
      - lint
      - test-and-build
      - docker-validation

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
              ghcr.io/sparshmajumdar/ticket-flow-system:latest
              ghcr.io/sparshmajumdar/ticket-flow-system:${{ github.sha }}


  # =========================================================================
  # CD STAGE 2: Package and Upload GitHub Pages Artifact
  # =========================================================================
  package-pages:
    name: Package GitHub Pages Artifact

    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    needs:
      - lint
      - test-and-build
      - docker-validation

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/


  # =========================================================================
  # CD STAGE 3: Deploy to GitHub Pages
  # =========================================================================
  deploy-pages:
    name: Deploy to GitHub Pages (CD)

    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    needs:
      - package-pages
      - docker-publish

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish Production Deployment Summary
        run: |
          echo "### 🚀 Production Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed To**: GitHub Pages" >> $GITHUB_STEP_SUMMARY
          echo "- **Live URL**: ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Docker Image**: ghcr.io/${{ github.repository_owner }}/ticket-flow-system:latest" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp**: $(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_STEP_SUMMARY
